# ─────────────────────────────────────────────────────────────────────────────
# SINGLE source of truth of Project 1 (SSLE).
# From here come: Incus projects and networks, containers, Prometheus targets,
# Wazuh agent enrolment and Alertmanager routes.
# Adding a site/element = adding lines here and running infra/deploy.sh.
#
# NOTE: pure "block style" format (no {flow}) on purpose, so that the portable
# reader infra/inventory.py can read it without depending on PyYAML/yq.
#
# Canonical identity of each element:  ssle:<region>:<site>:<host>:<instance>
#   e.g.: ssle:pt:avr:t490:ing-01
# The <host> (physical machine) is injected at deploy time (uname): t490 or mac-m2.
# ─────────────────────────────────────────────────────────────────────────────

region: pt

# SOC network (core): Wazuh, global observability, responder.
core:
  subnet: 10.10.0.0/24
  gateway: 10.10.0.1

sites:
  avr:
    city: Aveiro
    lat: 40.64
    lon: -8.65
    team: ops-avr
    subnet: 10.10.1.0/24
    gateway: 10.10.1.1
  opo:
    city: Porto
    lat: 41.15
    lon: -8.61
    team: ops-opo
    subnet: 10.10.2.0/24
    gateway: 10.10.2.1
  lis:
    city: Lisboa
    lat: 38.72
    lon: -9.14
    team: ops-lis
    subnet: 10.10.3.0/24
    gateway: 10.10.3.1

# ─── Elements ────────────────────────────────────────────────────────────────
# fields: name, site(or 'core'), role, ip, exporter(node|flask|global|registry|none),
#         (flask + role sensor = sends readings to the 1st dependency, at :8000/ingest)
#         deps(list of local instances), staging(true=included in the reduced slice),
#         image(optional: Incus image for this element only; by default the deploy's SSLE_IMAGE)
elements:

  # ---- core / SOC ----
  - name: obs
    site: core
    role: observability
    ip: 10.10.0.10
    exporter: global          # global Prometheus + Alertmanager + correlator
    staging: true
  - name: wazuh
    site: core
    role: siem
    ip: 10.10.0.30
    exporter: node
    image: images:ubuntu/22.04   # the path proved in lecture 6 (wazuh-install.sh -a -i, 4.14)
    staging: false            # heavy (4-6 GiB): T490 only
  - name: responder
    site: core
    role: responder
    ip: 10.10.0.20
    exporter: node
    staging: false

  # ---- site avr (headquarters + SOC): web/ingestion/storage ----
  - name: prom-01
    site: avr
    role: prometheus
    ip: 10.10.1.10
    exporter: node
    staging: true
  - name: reg-01
    site: avr
    role: registry
    ip: 10.10.1.20
    exporter: registry       # site registry (R2): leases + HTTP SD + site_info (registry/)
    staging: false
  - name: sto-01
    site: avr
    role: storage
    ip: 10.10.1.40
    exporter: node
    staging: true
  - name: ing-01
    site: avr
    role: ingestion
    ip: 10.10.1.30
    exporter: flask
    deps:
      - sto-01
    staging: true
  - name: ana-01
    site: avr
    role: analytics
    ip: 10.10.1.50
    exporter: flask
    deps:
      - sto-01
    staging: false

  # ---- site opo (IoT): sensors ----
  - name: prom-01
    site: opo
    role: prometheus
    ip: 10.10.2.10
    exporter: node
    staging: true
  - name: reg-01
    site: opo
    role: registry
    ip: 10.10.2.20
    exporter: registry
    staging: false
  - name: sen-01
    site: opo
    role: sensor
    ip: 10.10.2.50
    exporter: flask          # sends telemetry to ing-01 (legitimate baseline + client-side impact)
    deps:
      - ing-01@avr
    staging: true
  - name: sen-02
    site: opo
    role: sensor
    ip: 10.10.2.51
    exporter: flask          # sends telemetry to ing-01 (legitimate baseline + client-side impact)
    deps:
      - ing-01@avr
    staging: false

  # ---- site lis: web + e-mail ----
  - name: prom-01
    site: lis
    role: prometheus
    ip: 10.10.3.10
    exporter: node
    staging: false
  - name: web-01
    site: lis
    role: web
    ip: 10.10.3.60
    exporter: flask
    staging: false
  - name: mail-01
    site: lis
    role: mail
    ip: 10.10.3.70
    exporter: node
    staging: false
