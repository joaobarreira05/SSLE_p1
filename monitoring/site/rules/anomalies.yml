# Per-instance anomaly detection (Threat 1 — DoS/DDoS, and any traffic surge; Threat 2 — beaconing).
# Three layers, on purpose (defence in depth):
#   1) RELATIVE — TrafficAnomaly: ROBUST z-score against the last hour (learns each service's "normal").
#   2) ABSOLUTE, server — ServiceLatencyHigh: the latency SLO measured INSIDE the app.
#   3) ABSOLUTE, client — ClientLatencySLO / ClientUpstreamErrors: what the legitimate sensor FEELS.
#      The alert is born on the SENSOR (site opo); the correlator follows the inventory edge
#      sen-0x -> ing-01@avr and joins it to the server's incident (root cause ing-01), instead of blaming the sensor.
groups:
- name: anomalies
  rules:
  - alert: TrafficAnomaly
    # Centre = MEDIAN and spread = IQR/1.349 (≈ σ for a normal) over the last hour.
    # Why robust: with mean/std-dev, an attack "contaminates" the baseline — after ~6 min of
    # attack the std-dev has grown so much that z<3, and a 2nd attack within the same hour does
    # NOT fire (proved in monitoring/tests/anomaly_test.yml). The median and the IQR only move
    # if the attack occupies >25 % of the window (the IQR's breakdown point).
    # clamp_min(…, 0.5): with very regular traffic IQR≈0; the minimum avoids an infinite z
    # (in practice: fires above median + 1.5 requests/s).
    expr: |
      abs(
        instance:http_requests:rate1m
          - quantile_over_time(0.5, instance:http_requests:rate1m[1h])
      )
      / clamp_min(
          (quantile_over_time(0.75, instance:http_requests:rate1m[1h])
             - quantile_over_time(0.25, instance:http_requests:rate1m[1h])) / 1.349,
          0.5)
      > 3
    for: 1m
    labels:
      severity: warning
      kind: anomaly
    annotations:
      summary: "Anomalous traffic on {{ $labels.instance_name }} ({{ $labels.service }}) @ {{ $labels.site }}: {{ $value | printf \"%.1f\" }} robust deviations"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: ServiceLatencyHigh
    # Ingestion API SLO: p95 < 100 ms (at rest p95 is ~1 ms: a 100× margin).
    # It is meant as the symptom the CLIENT feels — it fires even if the attacker raises the load
    # slowly (low-and-slow) and "trains" the baseline of the relative rule.
    expr: instance:http_request_duration_seconds:p95_1m > 0.1
    for: 1m
    labels:
      severity: critical
      kind: performance
    annotations:
      summary: "p95 latency of {{ $labels.instance_name }} ({{ $labels.service }}) @ {{ $labels.site }} above the SLO: {{ $value | printf \"%.3f\" }} s > 0.100 s"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: ClientLatencySLO
    # SLO as seen by the CLIENT: p95 of the sensor -> ingestion send < 100 ms (the same SLO as the server).
    # Why: in T1 (staging, 3 runs) the server measured p95 = 23 ms and NEVER fired
    # ServiceLatencyHigh, while the sensor felt 242.5 ms (the queue before Flask serves).
    # At rest the sensor p95 was ≤ 38.7 ms (2.6× margin); retroactive analysis of the 3 runs
    # with this rule: it would fire at T0 + 80 s in all 3 (threats/t1-ddos/post-mortem.md).
    expr: instance:ssle_sensor_upstream_duration_seconds:p95_1m > 0.1
    for: 1m
    labels:
      severity: critical
      kind: performance
      slo: client
    annotations:
      summary: "Client {{ $labels.instance_name }} @ {{ $labels.site }} sees slow ingestion: p95 {{ $value | printf \"%.3f\" }} s > 0.100 s"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: ClientUpstreamErrors
    # More than half of the sensor's readings fail (5 s timeout / refusal): ingestion is
    # unreachable or saturated beyond delay. It is the remote symptom of an ing-01 that is down.
    expr: instance:ssle_sensor_readings:error_ratio_rate1m > 0.5
    for: 1m
    labels:
      severity: warning
      kind: dependency
      slo: client
    annotations:
      summary: "Client {{ $labels.instance_name }} @ {{ $labels.site }}: {{ $value | humanizePercentage }} of readings fail"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: OutboundAnomaly
    # T2: the sensor opens OUTBOUND connections outside its rhythm (beaconing to a C2). Same robust z-score as
    # TrafficAnomaly, over instance:node_tcp_active_opens:rate1m. clamp_min(…, 0.05): legitimate sending is
    # very regular (IQR≈0); with the minimum, it fires above median + 0.15 connections/s — a beacon every 3 s
    # adds 0.33/s (z ≈ 6.7). CRITICAL on purpose: it is what leads correlator → Wazuh 110210 → quarantine
    # (incus pause, reversible in 600 s). Cost of a false positive: a sensor paused for 10 min.
    expr: |
      abs(
        instance:node_tcp_active_opens:rate1m
          - quantile_over_time(0.5, instance:node_tcp_active_opens:rate1m[1h])
      )
      / clamp_min(
          (quantile_over_time(0.75, instance:node_tcp_active_opens:rate1m[1h])
             - quantile_over_time(0.25, instance:node_tcp_active_opens:rate1m[1h])) / 1.349,
          0.05)
      > 3
    for: 1m
    labels:
      severity: critical
      kind: anomaly
      threat: botnet
    annotations:
      summary: "Anomalous outbound connections on {{ $labels.instance_name }} @ {{ $labels.site }}: {{ $value | printf \"%.1f\" }} robust deviations (beaconing?)"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"
