# Deteção de anomalias por instância (Ameaça 1 — DoS/DDoS, e qualquer surto de tráfego; Ameaça 2 — beaconing).
# Três camadas, de propósito (defesa em profundidade):
#   1) RELATIVA — TrafficAnomaly: z-score ROBUSTO face à última hora (aprende o "normal" de cada serviço).
#   2) ABSOLUTA, servidor — ServiceLatencyHigh: o SLO de latência medido DENTRO da app.
#   3) ABSOLUTA, cliente — ClientLatencySLO / ClientUpstreamErrors: o que o sensor legítimo SENTE.
#      O alerta nasce no SENSOR (site opo); o correlator segue a aresta sen-0x -> ing-01@avr do
#      inventário e junta-o ao incidente do servidor (causa raiz ing-01), em vez de culpar o sensor.
groups:
- name: anomalies
  rules:
  - alert: TrafficAnomaly
    # Centro = MEDIANA e dispersão = IQR/1,349 (≈ σ numa normal) da última hora.
    # Porquê robusto: com média/desvio-padrão, um ataque "contamina" a baseline — ao fim de
    # ~6 min de ataque o desvio-padrão já cresceu tanto que z<3, e um 2.º ataque na mesma hora
    # NÃO dispara (provado em monitoring/tests/anomaly_test.yml). A mediana e o IQR só se movem
    # se o ataque ocupar >25 % da janela (ponto de rutura do IQR).
    # clamp_min(…, 0.5): com tráfego muito regular o IQR≈0; o mínimo evita z infinito
    # (na prática: dispara acima de mediana + 1,5 pedidos/s).
    expr: |
      abs(
        instance:http_requests:rate1m
          - quantile_over_time(0.5, instance:http_requests:rate1m[1h])
      )
      / clamp_min(
          (quantile_over_time(0.75, instance:http_requests:rate1m[1h])
             - quantile_over_time(0.25, instance:http_requests:rate1m[1h])) / 1.349,
          0.5)
      > 3
    for: 1m
    labels:
      severity: warning
      kind: anomaly
    annotations:
      summary: "Tráfego anómalo em {{ $labels.instance_name }} ({{ $labels.service }}) @ {{ $labels.site }}: {{ $value | printf \"%.1f\" }} desvios robustos"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: ServiceLatencyHigh
    # SLO da API de ingestão: p95 < 100 ms (em repouso o p95 é ~1 ms: margem de 100×).
    # É o sintoma que o CLIENTE sente — dispara mesmo que o atacante suba a carga devagar
    # (low-and-slow) e "eduque" a baseline da regra relativa.
    expr: instance:http_request_duration_seconds:p95_1m > 0.1
    for: 1m
    labels:
      severity: critical
      kind: performance
    annotations:
      summary: "Latência p95 de {{ $labels.instance_name }} ({{ $labels.service }}) @ {{ $labels.site }} acima do SLO: {{ $value | printf \"%.3f\" }} s > 0,100 s"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: ClientLatencySLO
    # SLO visto pelo CLIENTE: p95 do envio sensor -> ingestão < 100 ms (o mesmo SLO do servidor).
    # Porquê: na T1 (staging, 3 execuções) o servidor mediu p95 = 23 ms e NUNCA disparou o
    # ServiceLatencyHigh, enquanto o sensor sentia 242,5 ms (a fila antes do Flask atender).
    # Em repouso o p95 do sensor foi ≤ 38,7 ms (margem 2,6×); análise retroativa das 3 execuções
    # com esta regra: disparava em T0 + 80 s nas 3 (threats/t1-ddos/post-mortem.md).
    expr: instance:ssle_sensor_upstream_duration_seconds:p95_1m > 0.1
    for: 1m
    labels:
      severity: critical
      kind: performance
      slo: client
    annotations:
      summary: "Cliente {{ $labels.instance_name }} @ {{ $labels.site }} sente a ingestão lenta: p95 {{ $value | printf \"%.3f\" }} s > 0,100 s"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: ClientUpstreamErrors
    # Mais de metade das leituras do sensor falham (timeout 5 s / recusa): a ingestão está
    # inalcançável ou saturada para lá do atraso. É o sintoma remoto de um ing-01 em baixo.
    expr: instance:ssle_sensor_readings:error_ratio_rate1m > 0.5
    for: 1m
    labels:
      severity: warning
      kind: dependency
      slo: client
    annotations:
      summary: "Cliente {{ $labels.instance_name }} @ {{ $labels.site }}: {{ $value | humanizePercentage }} das leituras falham"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"

  - alert: OutboundAnomaly
    # T2: o sensor abre ligações de SAÍDA fora do seu ritmo (beaconing de um C2). Mesmo z-score robusto da
    # TrafficAnomaly, sobre instance:node_tcp_active_opens:rate1m. clamp_min(…, 0.05): o envio legítimo é
    # muito regular (IQR≈0); com o mínimo, dispara acima de mediana + 0,15 ligações/s — um beacon a cada 3 s
    # soma 0,33/s (z ≈ 6,7). CRITICAL de propósito: é o que leva o correlator → Wazuh 110210 → quarentena
    # (incus pause, reversível em 600 s). Custo de um falso positivo: um sensor pausado 10 min.
    expr: |
      abs(
        instance:node_tcp_active_opens:rate1m
          - quantile_over_time(0.5, instance:node_tcp_active_opens:rate1m[1h])
      )
      / clamp_min(
          (quantile_over_time(0.75, instance:node_tcp_active_opens:rate1m[1h])
             - quantile_over_time(0.25, instance:node_tcp_active_opens:rate1m[1h])) / 1.349,
          0.05)
      > 3
    for: 1m
    labels:
      severity: critical
      kind: anomaly
      threat: botnet
    annotations:
      summary: "Ligações de saída anómalas em {{ $labels.instance_name }} @ {{ $labels.site }}: {{ $value | printf \"%.1f\" }} desvios robustos (beaconing?)"
      identity: "ssle:{{ $labels.region }}:{{ $labels.site }}:{{ $labels.host }}:{{ $labels.instance_name }}"
