# Naming convention: level:metric:operations. Only the site-aggregates group (site.*:.*) goes up to the global.
groups:
- name: site-aggregates
  rules:
  - record: site:up:count
    expr: count by (region, site) (up{job="node"})
  - record: site:up:ratio
    expr: avg by (region, site) (up{job="node"})
  # Site location (lat/lon from the inventory, served by reg-01) → Geomap in the global Grafana.
  - record: site:info:last
    expr: max by (region, site, city, lat, lon) (site_info)
  # Dynamically registered elements (R2: the site grows without touching the inventory).
  - record: site:registry_instances:sum
    expr: sum by (region, site, kind) (ssle_registry_instances)
  - record: site:down:count
    expr: count by (region, site) (up{job="node"} == 0) or (site:up:count * 0)
  - record: site_service:http_requests:rate5m
    expr: sum by (region, site, service) (rate(http_requests_total[5m]))
  - record: site_service:http_errors:ratio_rate5m
    expr: |
      sum by (region, site, service) (rate(http_requests_total{code=~"5.."}[5m]))
        / clamp_min(sum by (region, site, service) (rate(http_requests_total[5m])), 1)
  # Latency (D of RED) and impact on the legitimate client (sensors) — also go up to the global.
  - record: site_service:http_request_duration_seconds:p95_5m
    expr: |
      histogram_quantile(0.95,
        sum by (le, region, site, service) (rate(http_request_duration_seconds_bucket[5m])))
  - record: site:ssle_sensor_readings:error_ratio_rate5m
    expr: |
      sum by (region, site) (rate(ssle_sensor_readings_total{result="error"}[5m]))
        / clamp_min(sum by (region, site) (rate(ssle_sensor_readings_total[5m])), 1e-9)
  - record: site:ssle_sensor_upstream_duration_seconds:p95_5m
    expr: |
      histogram_quantile(0.95,
        sum by (le, region, site) (rate(ssle_sensor_upstream_duration_seconds_bucket[5m])))

# Per INSTANCE: the granularity of local DETECTION (the alert says which element it is, with the
# full identity). These do NOT go up to the global (the federate match[] is "site.*:.*").
- name: instance-aggregates
  rules:
  - record: instance:http_requests:rate1m
    expr: |
      sum by (region, site, host, instance_name, role, service, team)
        (rate(http_requests_total{job="services"}[1m]))
  - record: instance:http_request_duration_seconds:p95_1m
    expr: |
      histogram_quantile(0.95,
        sum by (le, region, site, host, instance_name, role, service, team)
          (rate(http_request_duration_seconds_bucket{job="services"}[1m])))
  # CLIENT side (only sensors have these series): what the legitimate fleet feels when sending to
  # ingestion — includes the queue BEFORE Flask serves, which the server histogram does not see
  # (T1 lesson: server 23 ms, client 242 ms). Basis of the ClientLatencySLO/ClientUpstreamErrors alerts.
  - record: instance:ssle_sensor_upstream_duration_seconds:p95_1m
    expr: |
      histogram_quantile(0.95,
        sum by (le, region, site, host, instance_name, role, service, team)
          (rate(ssle_sensor_upstream_duration_seconds_bucket{job="services"}[1m])))
  # T2 (botnet): new OUTBOUND TCP connections per sensor (node_exporter, netstat). Normal is ~0.2/s (one POST
  # to ingestion every ~5 s); C2 beaconing adds its own rhythm. Basis of OutboundAnomaly.
  - record: instance:node_tcp_active_opens:rate1m
    expr: |
      sum by (region, site, host, instance_name, role, team)
        (rate(node_netstat_Tcp_ActiveOpens{job="node", role="sensor"}[1m]))
  - record: instance:ssle_sensor_readings:error_ratio_rate1m
    expr: |
      sum by (region, site, host, instance_name, role, service, team)
        (rate(ssle_sensor_readings_total{job="services",result="error"}[1m]))
      / clamp_min(
          sum by (region, site, host, instance_name, role, service, team)
            (rate(ssle_sensor_readings_total{job="services"}[1m])), 1e-9)
