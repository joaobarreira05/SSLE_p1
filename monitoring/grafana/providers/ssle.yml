# Dashboard provider: Grafana reads the JSON files in this folder at startup (and every 30 s).
# On core/obs the deploy copies monitoring/grafana/dashboards/ to /var/lib/grafana/dashboards/ssle.
# allowUiUpdates: false — the source is Git (build_dashboards.py); changes made in the UI are not saved.
apiVersion: 1
providers:
  - name: ssle
    folder: SSLE
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards/ssle
