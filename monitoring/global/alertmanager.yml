route:
  receiver: correlator
  group_by: [site, alertname]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 2h
  routes:
    - matchers: ['team="ops-avr"']
      receiver: correlator
    - matchers: ['team="ops-opo"']
      receiver: correlator
    - matchers: ['team="ops-lis"']
      receiver: correlator

# TOPOLOGICAL inhibition: the cause silences the symptoms of the SAME machine/site.
# (Correlation ACROSS elements, by dependency, is done by the correlator.)
inhibit_rules:
  - source_matchers: ['alertname="SiteUnreachable"']
    target_matchers: ['alertname=~"ElementDown|ServiceDown|ServiceDegraded|TrafficAnomaly|ServiceLatencyHigh|ClientLatencySLO|ClientUpstreamErrors"']
    equal: [site]
  - source_matchers: ['alertname="ElementDown"']
    target_matchers: ['alertname=~"ServiceDown|TrafficAnomaly|ServiceLatencyHigh|ClientLatencySLO|ClientUpstreamErrors"']
    equal: [site, instance_name]

receivers:
  - name: correlator
    webhook_configs:
      - url: http://localhost:9095/alerts
        send_resolved: true
