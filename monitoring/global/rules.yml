groups:
- name: global
  rules:
  # SiteUnreachable: the site's prom-01 does not answer the global (federation fails).
  # It is the only site-level alert — per-element detail comes from the site itself,
  # already with the full identity (ElementDown/ServiceDown/ServiceDegraded).
  - alert: SiteUnreachable
    expr: up{job="federate"} == 0
    for: 1m
    labels:
      severity: critical
      kind: availability
    annotations:
      summary: "Site unreachable from the core: {{ $labels.site }}"
