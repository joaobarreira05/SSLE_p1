# Prometheus GLOBAL (core/obs). Federa só AGREGADOS dos sites (R5: poupa banda).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    region: pt
    level: global
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: obs-node
    static_configs:
      - targets: ['localhost:9100']
        labels: {site: core, instance_name: obs, host: HOSTPLACEHOLDER}
  - job_name: hypervisor            # node_exporter do host físico (proxy device do Incus; [] fora do T490)
    file_sd_configs:
      - files: ['/etc/prometheus/hypervisor.json']
  - job_name: alertmanager
    static_configs:
      - targets: ['localhost:9093']
  - job_name: correlator
    static_configs:
      - targets: ['localhost:9095']
        labels: {site: core, instance_name: obs}
  - job_name: federate
    honor_labels: true
    metrics_path: /federate
    params:
      'match[]':
        - '{__name__=~"site.*:.*"}'   # só as recording rules agregadas dos sites
        - 'up'                        # liveness por alvo (barato; útil p/ RCA)
        - 'ALERTS{alertstate="firing"}'  # alertas ATIVOS dos sites (poucas séries) → vista do SOC no Grafana
    file_sd_configs:
      - files: ['/etc/prometheus/federate.json']
    metric_relabel_configs:
      # o ALERTS federado passa a site:alerts:firing (não se mistura com o ALERTS das regras do global)
      - source_labels: [__name__]
        regex: ALERTS
        target_label: __name__
        replacement: site:alerts:firing
