# GLOBAL Prometheus (core/obs). Federates only the sites' AGGREGATES (R5: saves bandwidth).
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    region: pt
    level: global
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: obs-node
    static_configs:
      - targets: ['localhost:9100']
        labels: {site: core, instance_name: obs, host: HOSTPLACEHOLDER}
  - job_name: hypervisor            # node_exporter of the physical host (Incus proxy device; [] outside the T490)
    file_sd_configs:
      - files: ['/etc/prometheus/hypervisor.json']
  - job_name: alertmanager
    static_configs:
      - targets: ['localhost:9093']
  - job_name: correlator
    static_configs:
      - targets: ['localhost:9095']
        labels: {site: core, instance_name: obs}
  - job_name: federate
    honor_labels: true
    metrics_path: /federate
    params:
      'match[]':
        - '{__name__=~"site.*:.*"}'   # only the sites' aggregated recording rules
        - 'up'                        # per-target liveness (cheap; useful for RCA)
        - 'ALERTS{alertstate="firing"}'  # ACTIVE alerts of the sites (few series) → SOC view in Grafana
    file_sd_configs:
      - files: ['/etc/prometheus/federate.json']
    metric_relabel_configs:
      # the federated ALERTS becomes site:alerts:firing (does not mix with the ALERTS of the global's rules)
      - source_labels: [__name__]
        regex: ALERTS
        target_label: __name__
        replacement: site:alerts:firing
