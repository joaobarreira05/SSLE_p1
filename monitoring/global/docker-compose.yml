# ⚠️ NOT USED by infra/deploy.sh (decision of 08/11): core/obs is provisioned with apt + systemd
# on the T490 too — the same path validated live in staging, without Docker nested in the container.
# File kept only as a reference and OUT OF DATE: Grafana lives in monitoring/grafana/
# (provider + generated dashboards), the correlator needs rca.py and there is no Dockerfile.
# (Original idea: global stack inside the core/obs container with nesting.)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules/rules.yml:ro
      - ../../build/federate.json:/etc/prometheus/federate.json:ro
    network_mode: host
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    network_mode: host
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
    network_mode: host
  correlator:
    build: ../../correlator
    volumes:
      - ../../correlator:/app:ro
      - ../../build/graph.json:/app/graph.json:ro
      - incidents:/var/log/ssle
    network_mode: host
volumes:
  incidents:
