# ⚠️ NÃO USADO pelo infra/deploy.sh (decisão de 08/11): o core/obs é provisionado por apt + systemd
# também no T490 — o mesmo caminho validado ao vivo em staging, sem Docker aninhado no contentor.
# Ficheiro mantido só como referência e DESATUALIZADO: o Grafana está em monitoring/grafana/
# (provider + dashboards gerados), o correlator precisa de rca.py e não há Dockerfile.
# (Ideia original: stack global dentro do contentor core/obs com nesting.)
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules/rules.yml:ro
      - ../../build/federate.json:/etc/prometheus/federate.json:ro
    network_mode: host
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    network_mode: host
  grafana:
    image: grafana/grafana:11.6.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana:/etc/grafana/provisioning:ro
    network_mode: host
  correlator:
    build: ../../correlator
    volumes:
      - ../../correlator:/app:ro
      - ../../build/graph.json:/app/graph.json:ro
      - incidents:/var/log/ssle
    network_mode: host
volumes:
  incidents:
