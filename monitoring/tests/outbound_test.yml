# promtool test rules monitoring/tests/outbound_test.yml
# T2 (beaconing): 1 h of legitimate sending (~0.2 outbound connections/s, with the sensor's ±20 % jitter),
# then 3 min of beacon every 3 s (+0.33/s) on sen-01; sen-02 stays normal throughout (counterproof).
rule_files:
  - ../site/rules/anomalies.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'instance:node_tcp_active_opens:rate1m{region="pt",site="opo",host="t490",instance_name="sen-01",role="sensor",team="ops-opo"}'
        values: '0.2 0.18 0.22 0.2 0.19 0.21x54 0.53x3 0.2x10'
      - series: 'instance:node_tcp_active_opens:rate1m{region="pt",site="opo",host="t490",instance_name="sen-02",role="sensor",team="ops-opo"}'
        values: '0.2 0.18 0.22 0.2 0.19 0.21x67'
    alert_rule_test:
      # rest (with jitter): nothing
      - eval_time: 59m
        alertname: OutboundAnomaly
        exp_alerts: []
      # 2nd minute of beacon: fires (for: 1m), only on sen-01, critical (→ correlator → 110210 → quarantine)
      - eval_time: 61m
        alertname: OutboundAnomaly
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: anomaly
              threat: botnet
              region: pt
              site: opo
              host: t490
              instance_name: sen-01
              role: sensor
              team: ops-opo
            exp_annotations:
              summary: "Anomalous outbound connections on sen-01 @ opo: 6.4 robust deviations (beaconing?)"
              identity: "ssle:pt:opo:t490:sen-01"
      # the beacon ends: the alert resolves
      - eval_time: 66m
        alertname: OutboundAnomaly
        exp_alerts: []
