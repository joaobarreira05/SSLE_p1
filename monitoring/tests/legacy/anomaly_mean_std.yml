# TEST ONLY (not deployed): the PREVIOUS version of TrafficAnomaly — z-score with the
# mean/std-dev of the last hour — applied to the same per-instance series.
# Serves as the counterproof in anomaly_test.yml: fires on the 1st attack but NOT on the 2nd,
# because the 1st attack inflated the std-dev ("the baseline learnt the attack").
groups:
- name: legacy-anomalies
  rules:
  - alert: TrafficAnomalyMeanStd
    expr: |
      abs(instance:http_requests:rate1m - avg_over_time(instance:http_requests:rate1m[1h]))
        / clamp_min(stddev_over_time(instance:http_requests:rate1m[1h]), 0.5) > 3
    for: 1m
    labels:
      severity: warning
      kind: anomaly
