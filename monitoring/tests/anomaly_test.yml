# promtool test rules monitoring/tests/anomaly_test.yml
# Scenario (1 sample/min): 1 h of legitimate telemetry at 0.2 requests/s (1 sensor every 5 s),
# ATTACK A of 10 min at 20 requests/s (t=60..69), 20 min of calm, ATTACK B (t=90..95).
rule_files:
  - ../site/rules/anomalies.yml
  - legacy/anomaly_mean_std.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'instance:http_requests:rate1m{region="pt",site="avr",host="mac-m2",instance_name="ing-01",role="ingestion",service="ingestion",team="ops-avr"}'
        values: '0.2x59 20x9 0.2x19 20x5'
    alert_rule_test:
      # at rest: nothing
      - eval_time: 59m
        alertname: TrafficAnomaly
        exp_alerts: []
      # attack A: the robust rule fires 1 min later (for: 1m)…
      - eval_time: 61m
        alertname: TrafficAnomaly
        exp_alerts:
          - exp_labels: &ing01
              severity: warning
              kind: anomaly
              region: pt
              site: avr
              host: mac-m2
              instance_name: ing-01
              role: ingestion
              service: ingestion
              team: ops-avr
            exp_annotations:
              summary: "Anomalous traffic on ing-01 (ingestion) @ avr: 39.6 robust deviations"
              identity: "ssle:pt:avr:mac-m2:ing-01"
      # …and so does the mean/std-dev version (so far the two agree)
      - eval_time: 61m
        alertname: TrafficAnomalyMeanStd
        exp_alerts:
          - exp_labels: *ing01
      # attack B, 20 min after A: the robust rule STILL fires…
      - eval_time: 91m
        alertname: TrafficAnomaly
        exp_alerts:
          - exp_labels: *ing01
            exp_annotations:
              summary: "Anomalous traffic on ing-01 (ingestion) @ avr: 39.6 robust deviations"
              identity: "ssle:pt:avr:mac-m2:ing-01"
      # …and mean/std-dev does NOT (z≈2.0: attack A inflated σ) → false negative avoided
      - eval_time: 91m
        alertname: TrafficAnomalyMeanStd
        exp_alerts: []

  # Absolute layer: latency SLO (p95 > 100 ms for 1 min)
  - interval: 15s
    input_series:
      - series: 'instance:http_request_duration_seconds:p95_1m{region="pt",site="avr",host="mac-m2",instance_name="ing-01",role="ingestion",service="ingestion",team="ops-avr"}'
        values: '0.002x7 0.4x7'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: ServiceLatencyHigh
        exp_alerts: []
      - eval_time: 3m30s
        alertname: ServiceLatencyHigh
        exp_alerts:
          - exp_labels:
              severity: critical
              kind: performance
              region: pt
              site: avr
              host: mac-m2
              instance_name: ing-01
              role: ingestion
              service: ingestion
              team: ops-avr
            exp_annotations:
              summary: "p95 latency of ing-01 (ingestion) @ avr above the SLO: 0.400 s > 0.100 s"
              identity: "ssle:pt:avr:mac-m2:ing-01"
