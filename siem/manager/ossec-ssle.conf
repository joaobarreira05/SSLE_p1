<!--
  Fragmento do ossec.conf do MANAGER (core/wazuh) — o SIEM-como-código que não cabe em rules/decoders.
  NÃO se copia à mão: o infra/deploy.sh (perfil full) gera-o com
      python3 infra/inventory.py wazuh-manager --agents <id nome por linha>
  (troca os marcadores pelos IPs do inventário e pelos IDs reais dos agentes, que só existem depois da inscrição)
  e acrescenta-o ao fim do /var/ossec/etc/ossec.conf entre os marcadores SSLE (idempotente).
  O Wazuh junta vários blocos <ossec_config> do mesmo ficheiro; validado no manager 4.14.10 real por
  siem/tests/run-logtest.sh (o analysisd e o execd recusam um <active-response> mal formado).

  Respostas: proporcionais, reversíveis (todas com timeout) e com alvo explícito.
    110210 / 110900 → ssle-quarantine no core/responder (incus pause do SENSOR; o script recusa o resto)
    110100          → ssle-ratelimit no próprio serviço, por srcip            (location local)
    110101          → ssle-ratelimit no próprio serviço, todas as origens     (location local)
    110110          → ssle-ratelimit no serviço que é causa raiz, por origem (defined-agent)
                      ⚠️ nunca quarentena: na T1 a causa raiz é a VÍTIMA (ing-01); isolá-la seria
                         fazer o DoS pelo atacante.
    110302          → firewall-drop no mail-01, por srcip                     (location local)
-->
<ossec_config>
  <global>
    <!-- Nunca nos bloqueamos a nós próprios: o SOC (core) e os Prometheus de site (fazem scrape a tudo).
         Os gateways das bridges dos sites NÃO entram: na T1 a carga sai do host por eles, e a resposta
         tem de os conseguir limitar. -->
@@WHITE_LIST@@
  </global>

  <ruleset>
    <list>etc/lists/ssle-reputation</list>
  </ruleset>

  <command>
    <name>ssle-quarantine</name>
    <executable>ssle-quarantine.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>ssle-ratelimit</name>
    <executable>ssle-ratelimit.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>ssle-quarantine</command>
    <location>defined-agent</location>
    <agent_id>@@AGENT_ID:core-responder@@</agent_id>
    <rules_id>110210,110900</rules_id>
    <timeout>600</timeout>
  </active-response>

  <active-response>
    <command>ssle-ratelimit</command>
    <location>local</location>
    <rules_id>110100,110101</rules_id>
    <timeout>300</timeout>
  </active-response>

@@AR_SERVICE_RATELIMIT@@

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>110302</rules_id>
    <timeout>600</timeout>
  </active-response>
</ossec_config>
