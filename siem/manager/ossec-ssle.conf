<!--
  Fragment of the MANAGER's ossec.conf (core/wazuh) — the SIEM-as-code that does not fit in rules/decoders.
  It is NOT copied by hand: infra/deploy.sh (full profile) generates it with
      python3 infra/inventory.py wazuh-manager --agents <one "id name" per line>
  (replaces the placeholders with the inventory IPs and the real agent IDs, which only exist after enrolment)
  and appends it to the end of /var/ossec/etc/ossec.conf between the SSLE markers (idempotent).
  Wazuh merges several <ossec_config> blocks of the same file; validated on a real 4.14.10 manager by
  siem/tests/run-logtest.sh (analysisd and execd reject a malformed <active-response>).

  Responses: proportional, reversible (all with a timeout) and with an explicit target.
    110210 / 110900 → ssle-quarantine on core/responder (incus pause of the SENSOR; the script refuses the rest)
    110100          → ssle-ratelimit on the service itself, per srcip               (location local)
    110101          → ssle-ratelimit on the service itself, all origins             (location local)
    110110          → ssle-ratelimit on the service that is the root cause, per origin (defined-agent)
                      ⚠️ never quarantine: in T1 the root cause is the VICTIM (ing-01); isolating it would
                         do the attacker's DoS for them.
    110302 / 110900 → firewall-drop on the agent that saw the impact, per srcip    (location local)
                      (for 110900 the child's alert REPLACES the 110302/110100 one: without this the bot kept
                       sending — seen in it-agents.sh; block at the target AND isolate at the origin)
-->
<ossec_config>
  <global>
    <!-- We never block ourselves: the SOC (core) and the site Prometheus servers (they scrape everything).
         The site bridge gateways are NOT included: in T1 the load leaves the host through them, and the
         response must be able to limit them. -->
@@WHITE_LIST@@
  </global>

  <ruleset>
    <list>etc/lists/ssle-reputation</list>
  </ruleset>

  <command>
    <name>ssle-quarantine</name>
    <executable>ssle-quarantine.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>
  <command>
    <name>ssle-ratelimit</name>
    <executable>ssle-ratelimit.sh</executable>
    <timeout_allowed>yes</timeout_allowed>
  </command>

  <active-response>
    <command>ssle-quarantine</command>
    <location>defined-agent</location>
    <agent_id>@@AGENT_ID:core-responder@@</agent_id>
    <rules_id>110210,110900</rules_id>
    <timeout>600</timeout>
  </active-response>

  <active-response>
    <command>ssle-ratelimit</command>
    <location>local</location>
    <rules_id>110100,110101</rules_id>
    <timeout>300</timeout>
  </active-response>

@@AR_SERVICE_RATELIMIT@@

  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>110302,110900</rules_id>
    <timeout>600</timeout>
  </active-response>
</ossec_config>
