<!-- Sensores IoT: perfil estreito. Vigiar portas à escuta (regra 533) e persistência. -->
<agent_config>
  <labels><label key="role">sensor</label></labels>
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -ltnp 2>/dev/null || netstat -ltnp</command>
    <frequency>120</frequency>
  </localfile>
</agent_config>
