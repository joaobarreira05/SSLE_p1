<!-- IoT sensors: narrow profile. Watch listening ports (rule 533 → 110202) and authentication logs.
     ⚠️ The alias MUST be exactly "netstat listening ports": that is what ruleset rule 533 looks for
        (<match>ossec: output: 'netstat listening ports</match>, with check_diff). With another alias the
        command runs but no rule sees it (defect of the previous version).
     ⚠️ Commands coming from the manager require logcollector.remote_commands=1 in the agent's
        local_internal_options.conf (infra/deploy.sh takes care of it in the full profile).
     TCP only and without -p (pid/process) on purpose: the pid changes on every restart and ephemeral UDP
     sockets would trigger check_diff without any new port (false positives). -->
<agent_config>
  <labels><label key="role">sensor</label></labels>
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -Hltn | awk '{print "tcp", $4}' | sort -u</command>
    <alias>netstat listening ports</alias>
    <frequency>60</frequency>
  </localfile>
  <!-- Real-time FIM on the PERSISTENCE directories (110201). It must be HERE: the sensors (the T2 target)
       live in opo, and before only site-avr had FIM — 110201 would never fire on a sensor. -->
  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/cron.d,/etc/systemd/system,/etc/rc.local,/root/.ssh</directories>
  </syscheck>
  <!-- SSH brute force (5760/5710 → 5763/5712 → 110200): rsyslog writes /var/log/auth.log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>
