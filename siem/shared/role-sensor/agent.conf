<!-- Sensores IoT: perfil estreito. Vigiar portas à escuta (regra 533 → 110202) e logs de autenticação.
     ⚠️ O alias TEM de ser exatamente "netstat listening ports": é o que a 533 do ruleset procura
        (<match>ossec: output: 'netstat listening ports</match>, com check_diff). Com outro alias o
        comando corre mas nenhuma regra o vê (defeito da versão anterior).
     ⚠️ Comandos vindos do manager exigem logcollector.remote_commands=1 no
        local_internal_options.conf do agente (o infra/deploy.sh trata disso no perfil full).
     Só TCP e sem -p (pid/processo) de propósito: o pid muda a cada reinício e os sockets UDP efémeros
     fariam disparar o check_diff sem haver porta nova (falsos positivos). -->
<agent_config>
  <labels><label key="role">sensor</label></labels>
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -Hltn | awk '{print "tcp", $4}' | sort -u</command>
    <alias>netstat listening ports</alias>
    <frequency>60</frequency>
  </localfile>
  <!-- FIM em tempo real nas pastas de PERSISTÊNCIA (110201). Tem de estar AQUI: os sensores (alvo da T2)
       vivem em opo, e antes só o site-avr tinha FIM — a 110201 nunca dispararia num sensor. -->
  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/cron.d,/etc/systemd/system,/etc/rc.local,/root/.ssh</directories>
  </syscheck>
  <!-- força bruta SSH (5760/5710 → 5763/5712 → 110200): o rsyslog escreve /var/log/auth.log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
</agent_config>
