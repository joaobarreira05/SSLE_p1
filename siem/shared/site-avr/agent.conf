<!-- Configuration delegated to the avr site. Change it here and every agent of the site receives it. -->
<agent_config>
  <labels>
    <label key="region">pt</label>
    <label key="site">avr</label>
  </labels>
  <!-- Real-time FIM on the persistence directories -->
  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/cron.d,/etc/systemd/system,/etc/rc.local</directories>
    <frequency>300</frequency>
  </syscheck>
</agent_config>
