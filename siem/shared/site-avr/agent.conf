<!-- Configuração delegada ao site avr. Muda aqui, todos os agentes do site recebem. -->
<agent_config>
  <labels>
    <label key="region">pt</label>
    <label key="site">avr</label>
  </labels>
  <!-- FIM em tempo real nas pastas de persistência -->
  <syscheck>
    <directories realtime="yes" report_changes="yes">/etc/cron.d,/etc/systemd/system,/etc/rc.local</directories>
    <frequency>300</frequency>
  </syscheck>
</agent_config>
