<!-- Exposed services (T1): the Flask service access log (SSLE_ACCESS_LOG, Apache "combined" format, which
     the web-accesslog decoder recognises) → 31108 → 110105 → 110100/110101 (with the ssle-ratelimit response). -->
<agent_config>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/ssle/access.log</location>
  </localfile>
</agent_config>
