<!-- Serviços expostos (T1): o log de acesso do serviço Flask (SSLE_ACCESS_LOG, formato "combined" do Apache,
     o que o decoder web-accesslog reconhece) → 31108 → 110105 → 110100/110101 (com resposta ssle-ratelimit). -->
<agent_config>
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/ssle/access.log</location>
  </localfile>
</agent_config>
