<!-- MTA (T3, lis/mail-01): Postfix + spamd escrevem no mail.log via rsyslog (aula 8)
     → 3301 (relay recusado) → 110302 / 110310 ; 3501 (spamd result) → 110301 / 110304 / 110300. -->
<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mail.log</location>
  </localfile>
</agent_config>
