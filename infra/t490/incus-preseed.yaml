# Preseed do `incus admin init` no T490 (Arch, raiz em ext4).
# Aplicado por infra/t490/setup-host.sh --apply  (só se ainda não houver pool "lab").
#
# - pool "lab" em btrfs: como a raiz é ext4, o Incus cria um FICHEIRO loop
#   (/var/lib/incus/disks/lab.img, esparso) e formata-o em btrfs → snapshots copy-on-write.
#   @@POOL_SIZE@@ é substituído pelo script (default 180GiB; o disco tem ~250 GiB livres).
# - incusbr0: bridge por omissão (só para testes); as redes do lab (net-*) cria-as o infra/deploy.sh
#   a partir do inventário. IPv6 desligado, como nas aulas.
# - profile default: disco raiz na pool "lab" (o deploy usa este profile para toda a frota).
config: {}
networks:
- name: incusbr0
  type: bridge
  config:
    ipv4.address: auto
    ipv4.nat: "true"
    ipv6.address: none
storage_pools:
- name: lab
  driver: btrfs
  config:
    size: @@POOL_SIZE@@
profiles:
- name: default
  devices:
    root:
      path: /
      pool: lab
      type: disk
    eth0:
      name: eth0
      network: incusbr0
      type: nic
