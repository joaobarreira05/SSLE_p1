# Preseed for `incus admin init` on the T490 (Arch, root on ext4).
# Applied by infra/t490/setup-host.sh --apply  (only if there is no "lab" pool yet).
#
# - "lab" pool on btrfs: since the root is ext4, Incus creates a loop FILE
#   (/var/lib/incus/disks/lab.img, sparse) and formats it as btrfs → copy-on-write snapshots.
#   @@POOL_SIZE@@ is replaced by the script (default 180GiB; the disk has ~250 GiB free).
# - incusbr0: default bridge (tests only); the lab networks (net-*) are created by infra/deploy.sh
#   from the inventory. IPv6 off, as in the lectures.
# - default profile: root disk on the "lab" pool (the deploy uses this profile for the whole fleet).
config: {}
networks:
- name: incusbr0
  type: bridge
  config:
    ipv4.address: auto
    ipv4.nat: "true"
    ipv6.address: none
storage_pools:
- name: lab
  driver: btrfs
  config:
    size: @@POOL_SIZE@@
profiles:
- name: default
  devices:
    root:
      path: /
      pool: lab
      type: disk
    eth0:
      name: eth0
      network: incusbr0
      type: nic
